<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="0.55" stop-color="#141418"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- squircle body -->
  <rect x="64" y="64" width="896" height="896" rx="205" ry="205" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="205" ry="205" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- top highlight -->
  <rect x="64" y="64" width="896" height="420" rx="205" ry="205" fill="#ffffff" fill-opacity="0.03"/>

  <!-- the notch -->
  <path d="M 356 64 L 668 64 L 668 128 Q 668 168 628 168 L 396 168 Q 356 168 356 128 Z" fill="#000000"/>

  <!-- halo behind sparkle -->
  <circle cx="512" cy="560" r="300" fill="url(#halo)"/>

  <!-- big sparkle -->
  <path d="M 512 322 Q 512 560 750 560 Q 512 560 512 798 Q 512 560 274 560 Q 512 560 512 322 Z"
        fill="url(#star)" filter="url(#glow)"/>

  <!-- small sparkle -->
  <path d="M 726 360 Q 726 430 796 430 Q 726 430 726 500 Q 726 430 656 430 Q 726 430 726 360 Z"
        fill="url(#star)" filter="url(#glow)"/>
</svg>
